<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAST MAP - AI ROAST COACH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding:10px}
.topbar{display:flex;justify-content:space-between;max-width:480px;margin:0 auto 8px;font-weight:900;font-size:18px}
.topbar span{color:#ff6b00}
.card{background:#111;border:6px solid #ff6b00;border-radius:28px;padding:16px;max-width:480px;margin:0 auto;color:#fff}
.head{font-size:12px;letter-spacing:1px;color:#ccc}
.big{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.big h1{font-size:64px;line-height:1}
.big h1 small{font-size:22px}
.badge{background:#ff6b00;padding:8px 12px;border-radius:20px;font-weight:900;font-size:13px}
.sub{font-size:12px;color:#ccc;margin-top:2px}
.score{display:flex;justify-content:space-between;background:#000;border-radius:12px;padding:12px;margin:12px 0;font-weight:900}
.score b{color:#ff6b00}
.graph{background:#000;border-radius:12px;padding:10px;margin:10px 0}
.graph .ghead{display:flex;justify-content:space-between;font-size:11px;font-weight:bold}
canvas{width:100%;height:80px}
.beanrow{display:flex;gap:10px;background:#000;border-radius:12px;padding:12px;align-items:center;margin:10px 0}
.circle{width:52px;height:52px;border-radius:50%;background:#2e7d32;border:3px solid #fff;flex-shrink:0}
.beanrow small{color:#aaa}
.coach{background:#fff;color:#111;border-radius:12px;padding:14px;font-size:16px;margin:10px 0}
.coach b{color:#c65a00}
.btnrow{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:16px 6px;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;background:#fff}
button.orange{background:#ff6b00;color:#fff}
button.blue{background:#29b6f6;color:#fff}
.mini{display:flex;justify-content:space-between;background:#000;border-radius:12px;padding:12px;font-weight:900;font-size:14px;margin:10px 0}
.mini b{color:#ff6b00}
</style>
</head>
<body>
<div class="topbar"><div>Sweet <span>FLAVOR</span></div><div>Clean <span>BODY</span></div></div>
<div class="card">
<div class="head">ROAST MAP - AI ROAST COACH</div>
<div class="big"><div><h1><span id="temp">165</span><small>°C</small></h1><div class="sub">BEAN TEMP - 11:52</div></div><div class="badge" id="phase">DRYING</div></div>
<div class="score"><div>CURRENT SCORE: <span id="score">70</span></div><div>TARGET <b>80+</b></div></div>
<div class="graph"><div class="ghead"><span>GRAFIK SUHU - ROAST CURVE</span><span style="color:#ff6b00" id="gtemp">165°C</span></div><canvas id="chart" width="440" height="80"></canvas></div>
<div class="beanrow"><div class="circle" id="circle"></div><div><b id="beanlabel">Bean: Hijau - Drying</b><br><small id="beandesc">Bean masih hijau, masih proses pengeringan.</small></div></div>
<div class="coach" id="coach"><b>Way too cold.</b> Tap GAS + to heat up.</div>
<div class="btnrow">
<button onclick="changeTemp(1)">GAS +</button>
<button onclick="changeTemp(-1)">GAS -</button>
<button class="orange" onclick="speak()">SPEAK:<br>LOWER GAS</button>
</div>
<div class="mini"><div>AIRFLOW: <b id="airlabel">50%</b></div><div>COOLING: <span id="coollabel">OFF</span></div></div>
<div class="btnrow">
<button onclick="changeAir(-1)">AIRFLOW -</button>
<button onclick="changeAir(1)">AIRFLOW +</button>
<button class="blue" id="coolbtn" onclick="toggleCool()">COOLING:<br>OFF</button>
</div>
</div>
<script>
let temp=165, air=50, cooling=false, history=[165,164,165,166,165,165,164];
function update(){
document.getElementById('temp').innerText=temp;
document.getElementById('gtemp').innerText=temp+'°C';
document.getElementById('airlabel').innerText=air+'%';
document.getElementById('coollabel').innerText=cooling?'ON':'OFF';
document.getElementById('coolbtn').innerHTML=cooling?'COOLING:<br>ON':'COOLING:<br>OFF';
let phase, bean, desc, coach, score, col;
if(temp<180){phase='DRYING';bean='Bean: Hijau - Drying';desc='Bean masih hijau, masih proses pengeringan.';coach='<b>Way too cold.</b> Tap GAS + to heat up.';score=70;col='#2e7d32';}
else if(temp<200){phase='YELLOWING';bean='Bean: Yellow - Yellowing';desc='Bean mulai menguning.';coach='<b>Warming up.</b> Keep GAS stable.';score=74;col='#d4a017';}
else if(temp<=210){phase='FIRST CRACK';bean='Bean: Light Brown - First Crack';desc='First crack! Aroma mulai keluar.';coach='<b>Perfect!</b> Hold this temp.';score=cooling?82:78;col='#a67c4a';}
else{phase='TOO HOT';bean='Bean: Dark - Burnt Risk';desc='Terlalu panas, risiko gosong.';coach='<b>Too hot!</b> Tap GAS - and turn COOLING ON.';score=55;col='#3e2723';}
document.getElementById('phase').innerText=phase;
document.getElementById('beanlabel').innerText=bean;
document.getElementById('beandesc').innerText=desc;
document.getElementById('coach').innerHTML=coach;
document.getElementById('score').innerText=score;
document.getElementById('circle').style.background=col;
draw();
}
function changeTemp(d){temp=Math.max(120,Math.min(240,temp+d));history.push(temp);if(history.length>20)history.shift();update();}
function changeAir(d){air=Math.max(0,Math.min(100,air+d*10));update();}
function toggleCool(){cooling=!cooling;update();}
function speak(){let t=new SpeechSynthesisUtterance(document.getElementById('coach').innerText+' Temperature '+temp+' degrees.');t.lang='en-US';speechSynthesis.speak(t);}
function draw(){let c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();ctx.strokeStyle='#ff6b00';ctx.lineWidth=3;history.forEach((v,i)=>{let x=i/19*c.width;let y=c.height-((v-120)/120)*c.height;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
update();
</script>
</body>
</html>
