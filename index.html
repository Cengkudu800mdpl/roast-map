<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAST MAP - AI ROAST COACH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;max-width:480px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:15px;letter-spacing:.5px}
.top span{background:#ff6b00;color:#fff;font-size:11px;padding:4px 8px;border-radius:20px}
.temp{text-align:center;margin:14px 0 4px}
.temp h1{font-size:52px}
.temp h1 small{font-size:18px}
.phase{text-align:center;font-weight:bold;font-size:18px;margin:4px 0}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.bean{text-align:center;margin:8px 0}
.beanbox{width:110px;height:70px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:12px}
.score{text-align:center;background:#e8f5e9;border-radius:12px;padding:10px;margin:10px 0}
.score b{font-size:22px}
.coach{background:#fff3e0;border-radius:12px;padding:12px;text-align:center;font-weight:bold;margin:10px 0}
.btnrow{display:flex;gap:8px;margin:8px 0}
button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer}
.gas{background:#ff9800;color:#fff}
.speak{background:#222;color:#fff}
.air{background:#e3f2fd}
.cool{background:#e8f5e9}
canvas{width:100%;height:90px;background:#fafafa;border-radius:10px;margin-top:8px}
.small{text-align:center;font-size:11px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<div class="top"><b>ROAST MAP - AI ROAST COACH</b><span>CENGKUDU</span></div>
<div class="temp"><h1><span id="temp">205</span><small>°C</small></h1></div>
<div class="phase"><span id="dot" class="dot" style="background:#c68a3d"></span><span id="phase">FIRST CRACK</span></div>
<div class="bean"><div id="beanbox" class="beanbox" style="background:#a67c4a">BEAN</div><div id="beanlabel"><b>Bean: Light Brown - First Crack</b></div></div>
<div class="score">CURRENT SCORE: <b id="score">78</b> &nbsp; TARGET 80+<br><span id="scorelabel" style="font-size:12px;color:#666">Good! Keep stable.</span></div>
<div class="coach" id="coach">Perfect! Hold this temp.</div>
<div class="btnrow">
<button class="gas" onclick="changeTemp(-1)">GAS -</button>
<button class="gas" onclick="changeTemp(1)">GAS +</button>
<button class="speak" onclick="speak()">SPEAK 🔊</button>
</div>
<div class="btnrow">
<button class="air" onclick="changeAir(-1)">AIRFLOW -</button>
<button class="air" id="airlabel">AIRFLOW: 1</button>
<button class="air" onclick="changeAir(1)">AIRFLOW +</button>
</div>
<div class="btnrow">
<button class="cool" id="coolbtn" onclick="toggleCool()">COOLING: ON</button>
</div>
<div style="text-align:center;font-weight:bold;margin-top:10px">TEMPERATURE GRAPH</div>
<canvas id="chart" width="440" height="90"></canvas>
<div class="small">ROAST MAP • Cengkudu 800 MDPL • Banyumas</div>
</div>
<script>
let temp=205, air=1, cooling=true, history=[205,204,205,206,205,205,204];
function update(){
document.getElementById('temp').innerText=temp;
document.getElementById('airlabel').innerText='AIRFLOW: '+air;
document.getElementById('coolbtn').innerText=cooling?'COOLING: ON':'COOLING: OFF';
let phase, color, bean, beanColor, coach, score;
if(temp<180){phase='DRYING';color='#4caf50';bean='Bean: Green - Drying';beanColor='#6aa84f';coach='Way too cold. Tap GAS + to heat up.';score=70;}
else if(temp<200){phase='YELLOWING';color='#ffca28';bean='Bean: Yellow - Yellowing';beanColor='#d4a017';coach='Warming up. Keep GAS stable.';score=74;}
else if(temp<=210){phase='FIRST CRACK';color='#c68a3d';bean='Bean: Light Brown - First Crack';beanColor='#a67c4a';coach='Perfect! Hold this temp.';score=cooling?82:78;}
else{phase='SECOND CRACK - TOO HOT';color='#d32f2f';bean='Bean: Dark - Burnt Risk';beanColor='#3e2723';coach='Too hot! Tap GAS - and turn COOLING ON.';score=55;}
document.getElementById('phase').innerText=phase;
document.getElementById('dot').style.background=color;
document.getElementById('beanlabel').innerHTML='<b>'+bean+'</b>';
document.getElementById('beanbox').style.background=beanColor;
document.getElementById('coach').innerText=coach;
document.getElementById('score').innerText=score;
document.getElementById('scorelabel').innerText=score>=80?'Excellent! You are on target.':'Good! Keep stable.';
draw();
}
function changeTemp(d){temp=Math.max(120,Math.min(240,temp+d));history.push(temp);if(history.length>20)history.shift();update();}
function changeAir(d){air=Math.max(0,Math.min(5,air+d));update();}
function toggleCool(){cooling=!cooling;update();}
function speak(){let t=new SpeechSynthesisUtterance(document.getElementById('coach').innerText+' Temperature '+temp+' degrees. Score '+document.getElementById('score').innerText);t.lang='en-US';speechSynthesis.speak(t);}
function draw(){
let c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
ctx.beginPath();ctx.strokeStyle='#ff6b00';ctx.lineWidth=3;
history.forEach((v,i)=>{let x=i/(19)*c.width;let y=c.height-((v-120)/120)*c.height;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
ctx.stroke();
ctx.fillStyle='#888';ctx.font='11px Arial';ctx.fillText('120°C',4,c.height-4);ctx.fillText('240°C',4,12);
}
update();
</script>
</body>
</html>
